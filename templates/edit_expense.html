{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expense.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section expense">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit expense</h1>
            <p class="auth-subtitle">Update the details of this expense</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <p id="expense-error" class="expense-error" role="alert">
                <i data-lucide="circle-alert" aria-hidden="true"></i>
                <span>{{ error }}</span>
            </p>
            {% endif %}

            <form method="post" action="{{ url_for('edit_expense', id=expense_id) }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <div class="expense-amount">
                        <span class="expense-currency" aria-hidden="true">₹</span>
                        <input type="number" id="amount" name="amount"
                               class="form-input" placeholder="0.00"
                               step="0.01" min="0.01" max="10000000"
                               value="{{ form.get('amount', '') }}" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled{% if form.get('category') not in categories %} selected{% endif %}>Choose a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}"{% if form.get('category') == category %} selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" max="{{ today }}"
                           value="{{ form.get('date', '') }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="expense-optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Dinner with friends"
                           maxlength="200"
                           value="{{ form.get('description', '') }}">
                </div>
                <div class="expense-actions">
                    <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                    <button type="submit" class="btn-primary">Save changes</button>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
